<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="420" viewBox="0 0 1280 420" role="img" aria-labelledby="title description">
  <title id="title">Timofey Soroka — Python developer</title>
  <desc id="description">A dark profile banner for a Python developer focused on Telegram systems and automation.</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0d1117"/>
      <stop offset="0.52" stop-color="#111b31"/>
      <stop offset="1" stop-color="#21143b"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#2dd4bf"/>
      <stop offset="0.54" stop-color="#60a5fa"/>
      <stop offset="1" stop-color="#c084fc"/>
    </linearGradient>
    <pattern id="grid" width="42" height="42" patternUnits="userSpaceOnUse">
      <path d="M 42 0 L 0 0 0 42" fill="none" stroke="#94a3b8" stroke-opacity=".10" stroke-width="1"/>
    </pattern>
    <filter id="blur" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="36"/>
    </filter>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="14" flood-color="#020617" flood-opacity=".55"/>
    </filter>
  </defs>

  <rect width="1280" height="420" rx="24" fill="url(#background)"/>
  <rect width="1280" height="420" rx="24" fill="url(#grid)"/>
  <circle cx="1070" cy="68" r="150" fill="#2563eb" fill-opacity=".28" filter="url(#blur)"/>
  <circle cx="1180" cy="354" r="172" fill="#a855f7" fill-opacity=".23" filter="url(#blur)"/>
  <circle cx="720" cy="390" r="135" fill="#14b8a6" fill-opacity=".16" filter="url(#blur)"/>

  <g opacity=".76" fill="none" stroke="url(#accent)" stroke-width="2">
    <path d="M898 97h242v180H978" opacity=".42"/>
    <path d="M936 133h166v104H1014" opacity=".65"/>
    <circle cx="1140" cy="97" r="7" fill="#c084fc" stroke="none"/>
    <circle cx="978" cy="277" r="7" fill="#2dd4bf" stroke="none"/>
    <circle cx="936" cy="133" r="5" fill="#60a5fa" stroke="none"/>
  </g>

  <g filter="url(#shadow)">
    <rect x="74" y="76" width="72" height="72" rx="18" fill="#0b1220" stroke="url(#accent)" stroke-width="2"/>
    <path d="M94 100l13 12-13 12m26-24l-13 12 13 12" fill="none" stroke="#e2e8f0" stroke-linecap="round" stroke-linejoin="round" stroke-width="4"/>
  </g>

  <text x="74" y="202" fill="#94a3b8" font-family="ui-sans-serif, system-ui, -apple-system, Segoe UI, sans-serif" font-size="17" font-weight="700" letter-spacing="4">PYTHON DEVELOPER</text>
  <text x="74" y="258" fill="#f8fafc" font-family="ui-sans-serif, system-ui, -apple-system, Segoe UI, sans-serif" font-size="52" font-weight="800" letter-spacing="-1">TIMOFEY SOROKA</text>
  <rect x="74" y="284" width="540" height="4" rx="2" fill="url(#accent)"/>
  <text x="74" y="330" fill="#cbd5e1" font-family="ui-sans-serif, system-ui, -apple-system, Segoe UI, sans-serif" font-size="23">Telegram systems · API automation · useful tools</text>

  <g font-family="ui-sans-serif, system-ui, -apple-system, Segoe UI, sans-serif" font-size="15" font-weight="700" letter-spacing="1.2">
    <rect x="74" y="357" width="118" height="34" rx="17" fill="#172554" stroke="#60a5fa" stroke-opacity=".65"/>
    <text x="96" y="379" fill="#bfdbfe">PYTHON</text>
    <rect x="204" y="357" width="144" height="34" rx="17" fill="#1f2937" stroke="#2dd4bf" stroke-opacity=".65"/>
    <text x="227" y="379" fill="#99f6e4">TELEGRAM</text>
    <rect x="360" y="357" width="160" height="34" rx="17" fill="#2e1065" stroke="#c084fc" stroke-opacity=".65"/>
    <text x="384" y="379" fill="#e9d5ff">AUTOMATION</text>
  </g>
</svg>
